document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ry: '', orderQuery: '', orderFilter: 'Todos', expanded: null, deliveryError: '', confirmCancel: null, confirmReset: false,\n      editingProduct: null, prodForm: this.emptyProdForm(), prodErrors: {} };\n  }\n  // ---------- datos ----------\n  load() {\n    let saved = null;\n    try { saved = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}\n    return this.normalize(saved && saved.products ? saved : this.seed());\n  }\n  normalize(d) {\n    return { seq: d.seq || 0, products: d.products, clients: d.clients, orders: d.orders || [], lastBackup: d.lastBackup || null,\n      settings: { promoBoxes: 4, promoPid: null, theme: 'dark', taxRate: this.props.taxRate ?? 15, allowBackorder: this.props.allowBackorder ?? false, ...(d.settings || {}) } };\n  }\n  persisted() { const { clients, products, orders, seq, settings, lastBackup } = this.state; return { clients, products, orders, seq, settings, lastBackup }; }\n  componentDidUpdate() {\n    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.persisted())); } catch (e) {}\n    const { flow, tab } = this.state;\n    if ((flow !== this._prev.flow || tab !== this._prev.tab) && this.scrollRef.current) this.scrollRef.current.scrollTop = 0;\n    this._prev = { flow, tab };\n  }\n  componentWillUnmount() { clearTimeout(this._t); }\n  // ---------- utilidades ----------\n  iso(d) { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }\n  addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return this.iso(d); }\n  parse(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }\n  dateLabel(iso) { return this.parse(iso).toLocaleDateString('es-EC', { weekday: 'short', day: 'numeric', month: 'short' }); }\n  money(n) { const v = (Math.round(n * 100) / 100).toFixed(2).split('.'); return '$' + v[0].replace(/\\B(?=(\\d{3})+(?!\\d))/g, '.') + ',' + v[1]; }\n  pct(n) { return Math.round(n * 100) + '%'; }\n  num(v) { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : NaN; }\n  packsUsed(pid, items) { return (items[pid + '|p'] || 0) + 12 * (items[pid + '|c'] || 0); }\n  line(p, unit, qty) { const box = unit === 'c'; return { pid: p.id, unit, name: p.name + (box ? ' · Caja x12' : ' · Paquete x100'), qty, price: box ? p.box : p.price, packs: qty * (box ? 12 : 1), cost: p.cost }; }\n  initials(n) { return n.split(/\\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join(''); }\n  emptyForm() { return { name: '', email: '', phone: '', doc: '', address: '' }; }\n  emptyProdForm() { return { name: '', price: '', box: '', cost: '', pvp: '' }; }\n  emptyDraft() { return { clientId: null, items: {}, delivery: 'hoy', date: this.addDays(1), address: '', payment: 'Efectivo', notes: '' }; }\n  isActive(o) { return o.status !== 'anulado'; }\n  isPaid(o) { return o.paid ?? (o.payment !== 'Crédito'); }\n  orderCost(o) { return o.items.reduce((a, i) => a + (i.packs || i.qty) * (i.cost || 0), 0); }\n  showToast(msg) { this.setState({ toast: msg }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: null }), 2400); }\n  taxRate() { return this.state && this.state.settings ? this.state.settings.taxRate : (this.props.taxRate ?? 15); }\n  rate() { return this.taxRate() / 100; }\n  // Celular ecuatoriano 09XXXXXXXX → 5939XXXXXXXX para wa.me\n  waNumber(phone) { const d = (phone || '').replace(/\\D/g, ''); if (/^09\\d{8}$/.test(d)) return '593' + d.slice(1); if (/^5939\\d{8}$/.test(d)) return d; return null; }\n  seed() {\n    const t = this.addDays(0), y = this.addDays(-1);\n    const products = [\n      { id: 'p1', sku: 'PV-MAT', name: 'Fundas mate', price: 7.5, box: 90, cost: 4.43, pvp: 12.5, stock: 24 },\n      { id: 'p2', sku: 'PV-DUA', name: 'Fundas dobles mate (dual)', price: 9, box: 108, cost: 5.06, pvp: 15, stock: 18 },\n      { id: 'p4', sku: 'PV-HOL', name: 'Fundas holográficas Lewtemi', price: 9, box: 108, cost: 6.07, pvp: 15, stock: 6 },\n      { id: 'p5', sku: 'PV-TRA', name: 'Fundas transparentes', price: 3.9, box: 46.8, cost: 1.38, pvp: 6.5, stock: 50 }\n    ];\n    const mk = (id, clientId, items, extra) => { const tt = this.totals(items); return { id, clientId, items, subtotal: tt.sub, tax: tt.tax, total: tt.total, notes: '', mailWanted: true, ...extra }; };\n    return {\n      seq: 2, products,\n      clients: [\n        { id: 'c1', name: 'Arena TCG Quito', email: 'pedidos@arenatcg.ec', phone: '0991234567', doc: '1792345678001', address: 'Av. Naciones Unidas E4-12, Quito' },\n        { id: 'c2', name: 'Cartas del Valle', email: 'compras@cartasdelvalle.ec', phone: '0987654321', doc: '1712345678', address: 'Av. Ilaló 234, San Rafael' }\n      ],\n      orders: [\n        mk('PV-0002', 'c2', [this.line(products[1], 'c', 1), this.line(products[3], 'p', 4)], { delivery: 'despacho', date: this.addDays(1), address: 'Av. Ilaló 234, San Rafael', payment: 'Transferencia', status: 'pendiente', createdAt: t }),\n        mk('PV-0001', 'c1', [this.line(products[0], 'c', 3)], { delivery: 'hoy', date: y, address: '', payment: 'Efectivo', status: 'entregado', createdAt: y })\n      ]\n    };\n  }\n  totals(items) {\n    const total = items.reduce((a, i) => a + i.qty * i.price, 0);\n    const sub = Math.round(total / (1 + this.rate()) * 100) / 100;\n    const cost = items.reduce((a, i) => a + (i.packs || i.qty) * (i.cost || 0), 0);\n    return { sub, tax: total - sub, total, profit: sub - cost, margin: sub ? (sub - cost) / sub : 0 };\n  }\n  // ---------- pedido en curso ----------\n  draftItems() {\n    const s = this.state;\n    return Object.entries(s.draft.items).filter(([, q]) => q > 0).map(([k, qty]) => {\n      const [pid, u] = k.split('|'); const p = s.products.find(x => x.id === pid); return p && this.line(p, u, qty);\n    }).filter(Boolean);\n  }\n  setDraft(patch) { this.setState(s => ({ draft: { ...s.draft, ...patch }, deliveryError: '' })); }\n  startOrder(clientId) {\n    const c = clientId && this.state.clients.find(x => x.id === clientId);\n    this.setState({ tab: 'order', flow: c ? 'products' : 'client', draft: { ...this.emptyDraft(), clientId: c ? c.id : null, address: c ? c.address : '' },\n      clientQuery: '', showNew: false, form: this.emptyForm(), errors: {}, deliveryError: '', sendMail: true });\n  }\n  pickClient(c) { this.setState(s => ({ draft: { ...s.draft, clientId: c.id, address: s.draft.address || c.address || '' }, flow: 'products' })); }\n  changeQty(pid, unit, delta) {\n    const p = this.state.products.find(x => x.id === pid);\n    const k = pid + '|' + unit, items = this.state.draft.items;\n    const next = { ...items, [k]: Math.max(0, (items[k] || 0) + delta) };\n    if (delta > 0 && !this.state.settings.allowBackorder && this.packsUsed(pid, next) > p.stock) {\n      const left = p.stock - this.packsUsed(pid, items);\n      return this.showToast(left <= 0 ? 'No queda stock de ' + p.name.toLowerCase() : 'Solo quedan ' + left + ' paquetes' + (unit === 'c' ? ', no alcanza una caja' : ''));\n    }\n    this.setDraft({ items: next });\n  }\n  goReview() {\n    const d = this.state.draft;\n    if (d.delivery === 'despacho' && !d.address.trim()) return this.setState({ deliveryError: 'Ingresa la dirección de despacho' });\n    this.setState({ flow: 'review' });\n  }\n  confirm() {\n    const s = this.state, items = this.draftItems(), t = this.totals(items), d = s.draft;\n    if (!items.length) return;\n    const id = 'PV-' + String(s.seq + 1).padStart(4, '0');\n    const hoy = d.delivery === 'hoy';\n    const promo = this.promoCalc(d.clientId, items.filter(i => i.unit === 'c').reduce((a, i) => a + i.qty, 0)).earned;\n    const promoPid = promo > 0 ? s.settings.promoPid : null;\n    const order = { id, clientId: d.clientId, items, delivery: d.delivery, date: hoy ? this.addDays(0) : d.date, address: d.address, payment: d.payment, notes: d.notes.trim(),\n      subtotal: t.sub, tax: t.tax, total: t.total, taxRate: this.taxRate(), status: hoy ? 'entregado' : 'pendiente', paid: d.payment !== 'Crédito', createdAt: this.addDays(0),\n      mailWanted: s.sendMail, promo, promoPid, promoGift: promo > 0 ? this.promoName() : '' };\n    const products = this.applyStock(s.products, order, -1);\n    const gift = promoPid && products.find(p => p.id === promoPid);\n    this.setState({ orders: [order, ...s.orders], products, seq: s.seq + 1, lastOrderId: id, flow: 'done' });\n    if (gift && gift.stock < 0) this.showToast('Ojo: no alcanza el stock de ' + gift.name.toLowerCase() + ' para el regalo');\n  }\n  // sign = -1 descuenta (confirmar), +1 devuelve (anular)\n  applyStock(products, o, sign) {\n    return products.map(p => {\n      let packs = o.items.filter(i => i.pid === p.id).reduce((a, i) => a + i.packs, 0);\n      if (o.promoPid === p.id) packs += o.promo || 0;\n      return packs ? { ...p, stock: p.stock + sign * packs } : p;\n    });\n  }\n  cancelOrder(id) {\n    this.setState(s => {\n      const o = s.orders.find(x => x.id === id);\n      if (!o || !this.isActive(o)) return null;\n      return { orders: s.orders.map(x => x.id === id ? { ...x, status: 'anulado' } : x), products: this.applyStock(s.products, o, 1), confirmCancel: null };\n    });\n    this.showToast(id + ' anulado · stock devuelto');\n  }\n  // ---------- promo ----------\n  promoName() { const p = this.state.products.find(x => x.id === this.state.settings.promoPid); return p ? p.name + ' · Paquete x100' : 'Regalo promocional'; }\n  boxesOf(id) { return this.state.orders.filter(o => o.clientId === id && this.isActive(o)).reduce((a, o) => a + o.items.filter(i => i.unit === 'c').reduce((b, i) => b + i.qty, 0), 0); }\n  promoCalc(id, add) { const th = Math.max(1, this.state.settings.promoBoxes), prev = this.boxesOf(id), tot = prev + add;\n    return { th, prev, tot, earned: Math.floor(tot / th) - Math.floor(prev / th), into: tot % th, left: th - (tot % th) }; }\n  setSettings(patch) { this.setState(s => ({ settings: { ...s.settings, ...patch } })); }\n  // ---------- clientes ----------\n  client(id) { return this.state.clients.find(c => c.id === id) || { name: 'Cliente', email: '', phone: '', address: '' }; }\n  saveClient() {\n    const f = this.state.form, e = {}, editing = this.state.editingClient;\n    const email = f.email.trim(), doc = f.doc.replace(/\\D/g, ''), phone = f.phone.replace(/\\D/g, '');\n    if (!f.name.trim()) e.name = 'Ingresa el nombre del cliente';\n    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) e.email = 'Ingresa un email válido';\n    else {\n      const dup = this.state.clients.find(c => c.id !== editing && c.email.toLowerCase() === email.toLowerCase());\n      if (dup) e.email = dup.active === false ? 'Este cliente está dado de baja; reactívalo en la lista' : 'Ya existe un cliente con este email';\n    }\n    if (f.phone.trim() && (phone.length < 9 || phone.length > 10)) e.phone = 'El teléfono debe tener 9 o 10 dígitos';\n    if (f.doc.trim() && doc.length !== 10 && doc.length !== 13) e.doc = 'La cédula tiene 10 dígitos y el RUC 13';\n    if (Object.keys(e).length) return this.setState({ errors: e });\n    const data = { name: f.name.trim(), email, phone: f.phone.trim(), doc, address: f.address.trim() };\n    if (editing) {\n      this.setState(s => ({ clients: s.clients.map(c => c.id === editing ? { ...c, ...data } : c), form: this.emptyForm(), errors: {}, clientsNew: false, editingClient: null }));\n      return this.showToast('Cliente actualizado');\n    }\n    const c = { id: 'c' + Date.now(), active: true, ...data };\n    if (this.state.tab === 'clients') { this.setState(s => ({ clients: [c, ...s.clients], form: this.emptyForm(), errors: {}, clientsNew: false, clientsFilter: 'Activos' })); return this.showToast('Cliente creado'); }\n    this.setState(s => ({ clients: [c, ...s.clients], form: this.emptyForm(), errors: {}, showNew: false, draft: { ...s.draft, clientId: c.id, address: c.address }, flow: 'products' }));\n    this.showToast('Cliente guardado para próximos pedidos');\n  }\n  // ---------- productos ----------\n  editProduct(p) {\n    this.setState({ editingProduct: p.id, prodErrors: {}, prodForm: { name: p.name, price: String(p.price), box: String(p.box), cost: String(p.cost), pvp: p.pvp ? String(p.pvp) : '' } });\n  }\n  saveProduct() {\n    const f = this.state.prodForm, e = {}, id = this.state.editingProduct;\n    const price = this.num(f.price), cost = this.num(f.cost), box = f.box.trim() ? this.num(f.box) : price * 12, pvp = f.pvp.trim() ? this.num(f.pvp) : 0;\n    if (!f.name.trim()) e.name = 'Ingresa el nombre';\n    if (!(price > 0)) e.price = 'Precio inválido';\n    if (!(box > 0)) e.box = 'Precio inválido';\n    if (!(cost >= 0)) e.cost = 'Costo inválido';\n    if (!(pvp >= 0)) e.pvp = 'PVP inválido';\n    if (Object.keys(e).length) return this.setState({ prodErrors: e });\n    const data = { name: f.name.trim(), price, box: Math.round(box * 100) / 100, cost, pvp };\n    if (id === 'new') this.setState(s => ({ products: [...s.products, { id: 'p' + Date.now(), stock: 0, ...data }], editingProduct: null, prodForm: this.emptyProdForm() }));\n    else this.setState(s => ({ products: s.products.map(p => p.id === id ? { ...p, ...data } : p), editingProduct: null, prodForm: this.emptyProdForm() }));\n    this.showToast(id === 'new' ? 'Producto creado · ajusta su stock con +' : 'Precios actualizados');\n  }\n  adjustStock(pid, d) { this.setState(s => ({ products: s.products.map(p => p.id === pid ? { ...p, stock: Math.max(0, p.stock + d) } : p) })); }\n  // ---------- respaldo ----------\n  exportBackup() {\n    const now = new Date();\n    const data = { app: 'python-vault', version: 3, exportedAt: now.toISOString(), ...this.persisted(), lastBackup: now.toISOString() };\n    const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));\n    const a = document.createElement('a');\n    a.href = url; a.download = 'python-vault-respaldo-' + this.iso(now) + '.json';\n    document.body.appendChild(a); a.click(); a.remove();\n    setTimeout(() => URL.revokeObjectURL(url), 1000);\n    this.setState({ lastBackup: now.toISOString() });\n    this.showToast('Respaldo descargado');\n  }\n  importBackup(e) {\n    const input = e.target, file = input.files && input.files[0];\n    if (!file) return;\n    file.text().then(txt => {\n      const d = JSON.parse(txt);\n      if (!d || !Array.isArray(d.products) || !Array.isArray(d.clients) || !Array.isArray(d.orders)) throw new Error('formato');\n      if (!window.confirm('Se reemplazarán los datos de este dispositivo por los del respaldo (' + d.orders.length + ' pedidos, ' + d.clients.length + ' clientes). ¿Continuar?')) return;\n      this.setState({ ...this.normalize(d), draft: this.emptyDraft(), tab: 'home', flow: null, lastOrderId: null, expanded: null });\n      this.showToast('Respaldo importado');\n    }).catch(() => this.showToast('El archivo no es un respaldo válido')).finally(() => { input.value = ''; });\n  }\n  resetData() {\n    this.setState({ clients: [], orders: [], seq: 0, confirmReset: false, draft: this.emptyDraft(), lastOrderId: null, expanded: null, tab: 'home', flow: null });\n    this.showToast('Clientes y pedidos borrados');\n  }\n  // ---------- vistas ----------\n  stockTag(n) {\n    if (n <= 0) return { stockLabel: n < 0 ? 'Faltan ' + (-n) + ' paq.' : 'Sin stock', stockBg: 'var(--danger-soft)', stockColor: 'var(--danger-ink)' };\n    if (n < 12) return { stockLabel: 'Quedan ' + n + ' paq.', stockBg: 'var(--warn-soft)', stockColor: 'var(--warn-ink)' };\n    return { stockLabel: n + ' paq.', stockBg: 'var(--line-2)', stockColor: 'var(--muted)' };\n  }\n  chip(sel) { return sel ? { bg: 'var(--accent)', color: 'var(--on-accent)', border: 'var(--accent)', selected: 'true' } : { bg: 'var(--card)', color: 'var(--ink)', border: 'var(--line)', selected: 'false' }; }\n  toggle(on) { return { track: on ? 'var(--accent)' : 'var(--disabled)', knob: on ? '23px' : '3px', aria: on ? 'true' : 'false' }; }\n
